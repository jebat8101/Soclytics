services:
  birdy-edwards-lite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: birdy-edwards-lite
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - ./app/fb_cookies.pkl:/app/fb_cookies.pkl
      - ./app/ig_cookies.pkl:/app/ig_cookies.pkl
      - ./app/reddit_cookies.pkl:/app/reddit_cookies.pkl
      - ./app/threads_cookies.pkl:/app/threads_cookies.pkl
      - ./app/socmint_fb.db:/app/socmint_fb.db
      - ./app/socmint_ig.db:/app/socmint_ig.db
      - ./app/socmint_reddit.db:/app/socmint_reddit.db
      - ./app/socmint_threads.db:/app/socmint_threads.db
      - ./app/socmint_tg.db:/app/socmint_tg.db
      - ./app/face_data:/app/face_data
      - ./app/face_data_ig:/app/face_data_ig
      - ./app/face_data_threads:/app/face_data_threads
      - ./app/face_data_tg:/app/face_data_tg
      - ./app/post_screenshots:/app/post_screenshots
      - ./app/telegram_media:/app/telegram_media
      - ./app/reports:/app/reports
      - ./app/telegram_config.json:/app/telegram_config.json
      - ${TG_SESSION_FILE:-./app/telegram.session}:/app/telegram.session
      - ./app/icons:/app/icons
    environment:
      - DISPLAY=:99
      - PORT=5000
      - PYTHONUNBUFFERED=1
      - TG_API_ID=${TG_API_ID:-}
      - TG_API_HASH=${TG_API_HASH:-}
      - TG_SESSION=${TG_SESSION:-/app/telegram}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/facebook/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
