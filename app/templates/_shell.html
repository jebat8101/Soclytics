{# Shared chrome + platform tabs. Include inside page topbars. #}
<style>
  .platform-tabs {
    display: flex;
    gap: 6px;
    align-items: center;
    margin: 0 16px;
  }
  .platform-tab {
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none;
    border: 1px solid var(--border, #2a2a2e);
    border-radius: 3px;
    color: var(--text-faint, #8a8a92);
    background: transparent;
  }
  .platform-tab:hover {
    color: var(--text, #f5f5f7);
    border-color: var(--border-strong, #3a3a40);
  }
  .platform-tab.active {
    color: #0a0a0b;
    background: var(--accent, #d4a24c);
    border-color: var(--accent, #d4a24c);
  }
</style>
<nav class="platform-tabs" aria-label="Platform">
  <a class="platform-tab {% if active_platform == 'facebook' %}active{% endif %}" href="/facebook/">Facebook</a>
  <a class="platform-tab {% if active_platform == 'instagram' %}active{% endif %}" href="/instagram/">Instagram</a>
  <a class="platform-tab {% if active_platform == 'reddit' %}active{% endif %}" href="/reddit/">Reddit</a>
  <a class="platform-tab {% if active_platform == 'threads' %}active{% endif %}" href="/threads/">Threads</a>
  <a class="platform-tab {% if active_platform == 'telegram' %}active{% endif %}" href="/telegram/">Telegram</a>
  <a class="platform-tab {% if active_platform == 'x' %}active{% endif %}" href="/x/">X</a>
</nav>
